name: Build Adrian Admin Tools APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Android runners already contain the Android SDK.
      # Avoid android-actions/setup-android here: its sdkmanager bootstrap
      # can fail when the runner image ships a newer command-line-tools revision.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o Adrian_Admin_Tools_v2_project.zip
          test -f AdrianAdminTools/settings.gradle.kts

      - name: Build debug APK
        run: |
          cd AdrianAdminTools
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Adrian-Admin-Tools-v2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adrian-Admin-Tools-v2-APK
          path: Adrian-Admin-Tools-v2.apk
          if-no-files-found: error
