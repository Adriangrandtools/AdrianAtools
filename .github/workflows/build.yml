
name: Build Adrian Admin Tools

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o Adrian_Admin_Tools_project.zip

      - name: Build APK
        run: |
          cd AdrianAdminTools
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Adrian-Admin-Tools.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Adrian-Admin-Tools-APK
          path: Adrian-Admin-Tools.apk
          
